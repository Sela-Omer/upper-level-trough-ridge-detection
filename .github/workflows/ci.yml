name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -m "not paper and not remote" -q

  paper-regression:
    if: ${{ vars.ULTR_ENABLE_PAPER_TESTS == '1' }}
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ULTR_RUN_PAPER_TESTS: "1"
      ULTR_DATA_REVISION: ${{ vars.ULTR_DATA_REVISION }}
      ULTR_MODEL_REVISION: ${{ vars.ULTR_MODEL_REVISION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/paper -q
